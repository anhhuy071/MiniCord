version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: minicord-db
    restart: always
    environment:
      POSTGRES_USER: minicord
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: minicord_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: minicord-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@minicord.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
