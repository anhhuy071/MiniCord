$kind: http-request
name: Create Server
order: 2000
method: POST
url: '{{baseUrl}}/api/servers'
description: 'Creates a new server. The creator is automatically added as OWNER and a default `general` channel is created.'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "My Awesome Server",
      "imageUrl": "https://example.com/image.png"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res.id) {
        pm.collectionVariables.set("serverId", res.id);
      }
