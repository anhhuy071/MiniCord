$kind: http-request
name: Register
order: 1000
method: POST
url: '{{baseUrl}}/api/auth/register'
auth:
  type: noauth
description: Register a new user. Returns user info and a JWT token.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "testuser",
      "email": "testuser@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res.token) {
        pm.collectionVariables.set("authToken", res.token);
      }
